<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>姐姐的亚欧非漫游指南</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
<header class="hero">
  <div class="hero-bg show" style="background-image:url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1600&q=80&fm=jpg&fit=crop');"></div>
  <div class="hero-bg" style="background-image:url('https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=1600&q=80&fm=jpg&fit=crop');"></div>
  <div class="hero-bg" style="background-image:url('https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1600&q=80&fm=jpg&fit=crop');"></div>
  <div class="hero-bg" style="background-image:url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1600&q=80&fm=jpg&fit=crop');"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="hero-content">
    <h1>姐姐的亚欧非漫游指南</h1>
    <p>从新疆出发，穿越中亚、高加索、土耳其、巴尔干、欧洲、北非、中东</p>
    <button id="themeToggle" onclick="toggleTheme()" title="切换深浅色">🌙</button>
  </div>
</header>
<div class="tabs">
  <button class="tab-btn active" data-tab="cities" onclick="switchTab('cities')">选城市</button>
  <button class="tab-btn" data-tab="checklist" onclick="switchTab('checklist')">清单栏</button>
  <button class="tab-btn" data-tab="guide" onclick="switchTab('guide')">城市攻略</button>
  <button class="tab-btn" data-tab="visa" onclick="switchTab('visa')">签证助手</button>
  <button class="tab-btn" data-tab="trip" onclick="switchTab('trip')">我的行程</button>
  <button class="tab-btn" data-tab="budget" onclick="switchTab('budget')">预算规划</button>
  <button class="tab-btn" data-tab="tips" onclick="switchTab('tips')">行前贴士</button>
</div>

<div id="cities" class="section active">
  <div id="routeLockBar"></div>
  <input type="search" id="citySearch" placeholder="🔍 搜索城市或国家..." oninput="searchCities()" style="width:100%;box-sizing:border-box;padding:12px 16px;border:1px solid var(--border);border-radius:24px;background:var(--card);color:var(--text);font-size:0.95rem;margin-bottom:12px;">
  <div class="filter-btns" style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
    <button class="filter-btn active" onclick="filterRegion('all',this)">全部</button>
    <button class="filter-btn" onclick="filterRegion('中亚',this)">中亚</button>
    <button class="filter-btn" onclick="filterRegion('高加索',this)">高加索</button>
    <button class="filter-btn" onclick="filterRegion('土耳其',this)">土耳其</button>
    <button class="filter-btn" onclick="filterRegion('巴尔干',this)">巴尔干</button>
    <button class="filter-btn" onclick="filterRegion('欧洲',this)">欧洲</button>
    <button class="filter-btn" onclick="filterRegion('北非',this)">北非</button>
    <button class="filter-btn" onclick="filterRegion('中东',this)">中东</button>
    <button class="filter-btn" onclick="filterRegion('东北亚',this)">东北亚</button>
    <button class="filter-btn" onclick="filterRegion('东非',this)">东非</button>
    <button class="filter-btn" onclick="filterRegion('南非',this)">南非</button>
    <button class="filter-btn" onclick="filterRegion('南亚',this)">南亚</button>
    <button class="filter-btn" onclick="filterRegion('东南亚',this)">东南亚</button>
  </div>
  <div id="cityList"></div>
</div>

<div id="checklist" class="section">
  <div class="card">
    <h3>添加自定义事项</h3>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <input type="text" id="newItemText" placeholder="添加新事项..." style="flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:24px;">
      <select id="newItemCat" style="padding:10px;border-radius:24px;border:1px solid var(--border);">
        <option value="places">想去的地方</option>
        <option value="food">必吃美食</option>
        <option value="shopping">购物清单</option>
        <option value="visa">签证材料</option>
        <option value="gear">装备清单</option>
        <option value="health">健康/药品</option>
        <option value="safety">安全备忘</option>
        <option value="misc">其他</option>
      </select>
      <button class="btn" onclick="addCheckItem()">添加</button>
    </div>
  </div>
  <div id="checklistContent"></div>
</div>

<div id="guide" class="section"><div id="guideContent"></div></div>

<div id="visa" class="section">
  <div class="card"><h3>签证办理时间线</h3><div class="timeline" id="visaTimeline"></div></div>
  <div class="card"><h3>签证要求一览</h3><table class="visa-table" id="visaTable"></table></div>
</div>

<div id="trip" class="section">
  <div class="card">
    <h3>🗓️ 行程规划</h3>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
      <label style="font-size:0.85rem;">出发日期 <input type="date" id="tripDateInput" style="padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);" onchange="setTripDate()"></label>
      <label style="font-size:0.85rem;">每城停留 <select id="daysPerCitySel" style="padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);" onchange="setDaysPerCity()">
        <option value="1">1天</option><option value="2">2天</option><option value="3" selected>3天</option>
        <option value="4">4天</option><option value="5">5天</option>
      </select></label>
      <button class="btn" onclick="sortTrip()">🔀 按地理路线排序</button>
      <button class="btn btn-blue" onclick="shareTrip()">📤 分享行程</button>
    </div>
  </div>
  <div class="trip-summary" id="tripSummary"><h2>我的亚欧非环线</h2><p>还没有选择任何城市</p></div>
  <div id="journeyBox"></div>
  <div class="card"><h3>🗺️ 每日行程</h3><div class="timeline" id="itineraryList"></div></div>
  <div class="trip-list" id="tripList"></div>
</div>

<div id="budget" class="section">
  <div class="card">
    <h3>预算计算器</h3>
    <p style="font-size:0.85rem;color:var(--text-light);margin:0 0 4px;">调整每日基础预算（食宿+市内交通），城际交通与大额体验自动估算</p>
    <input type="range" id="budgetSlider" min="80" max="600" value="180" oninput="updateBudget()" style="width:100%;margin:16px 0;">
    <div style="text-align:center;font-size:1.5rem;color:var(--primary);font-weight:700;">¥<span id="budgetValue">180</span>/天</div>
  </div>
  <div id="budgetBreakdown"></div>
</div>

<div id="tips" class="section"><div id="tipsContent"></div></div>
</div>

<div class="sticky-bar">
  <button class="btn" onclick="switchTab('cities')">选城市</button>
  <button class="btn btn-blue" onclick="switchTab('trip')">行程 (<span id="tripCount">0</span>)</button>
  <button class="btn btn-red" onclick="resetData()">重置</button>
</div>

<script src="js/data-cities.js"></script>
<script src="js/data-meta.js"></script>
<script src="js/data-checklist.js"></script>
<script src="js/app.js"></script>
</body>
</html>
